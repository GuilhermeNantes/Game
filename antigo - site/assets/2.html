<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/imagens/icon/1-7b9df8e0.ico">
    <title>Duke Race</title>
    <!-- Include Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex flex-col justify-end">
    <!-- Game Canvas Placeholder (for future game rendering) -->
    <div class="flex-grow bg-gray-800"></div>

    <!-- Control Buttons -->
    <div class="fixed bottom-0 left-0 right-0 p-4 flex justify-between">
        <!-- Left Side: Steering Buttons (Side by Side) -->
        <div class="flex space-x-4">
            <button id="steer-left" 
                    class="w-16 h-16 bg-blue-600 text-white rounded-full flex items-center justify-center text-2xl shadow-lg active:bg-blue-800"
                    ontouchstart="handleButton('Steer Left Pressed')"
                    ontouchend="handleButton('Steer Left Released')">
                ←
            </button>
            <button id="steer-right" 
                    class="w-16 h-16 bg-blue-600 text-white rounded-full flex items-center justify-center text-2xl shadow-lg active:bg-blue-800"
                    ontouchstart="handleButton('Steer Right Pressed')"
                    ontouchend="handleButton('Steer Right Released')">
                →
            </button>
        </div>
        <!-- Right Side: Accelerate/Brake Buttons -->
        <div class="flex flex-col space-y-4">
            <button id="accelerate" 
                    class="w-16 h-16 bg-green-600 text-white rounded-full flex items-center justify-center text-2xl shadow-lg active:bg-green-800"
                    ontouchstart="handleButton('Accelerate Pressed')"
                    ontouchend="handleButton('Accelerate Released')">
                ↑
            </button>
            <button id="brake" 
                    class="w-16 h-16 bg-red-600 text-white rounded-full flex items-center justify-center text-2xl shadow-lg active:bg-red-800"
                    ontouchstart="handleButton('Brake Pressed')"
                    ontouchend="handleButton('Brake Released')">
                ↓
            </button>
        </div>
    </div>

    <!-- JavaScript for Button Interaction -->
    <script>
        function handleButton(action) {
            console.log(action);
            // Add your game logic here (e.g., update car movement)
        }
    </script>
</body>
</html>
