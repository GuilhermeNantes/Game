<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Responsivo com Abas</title>
    <style>
        /* ----------------------------------------------------
           CSS - MOBILE-FIRST (Estilos para Telas Menores)
           ---------------------------------------------------- */
        
        /* Reset básico e fundo da página */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
            /* No mobile, o body pode ser apenas um container */
        }

        /* Container principal do menu (Ocupa 100% da largura no mobile) */
        .menu-container {
            width: 100%;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        /* Estrutura do menu de abas */
        .tabs-menu {
            display: flex;
            list-style: none;
            margin: 0;
            padding: 0;
            background-color: transparent;
            position: relative;
            z-index: 2;
            overflow-x: auto; /* Permite rolagem horizontal se tiver muitas abas */
        }
        
        /* Setas de navegação (<< e >>) - Opcional ocultar no mobile */
        .tabs-arrow {
            color: #999;
            font-size: 14px;
            font-weight: bold;
            padding: 8px 10px;
            cursor: pointer;
            user-select: none;
            line-height: 20px;
            background-color: #f9f9f9;
            flex-shrink: 0; /* Impede que as setas diminuam */
        }
        
        /* Item da aba */
        .tabs-menu li {
            position: relative;
            background-color: #f9f9f9;
            padding: 8px 15px; /* Padding um pouco menor para telas pequenas */
            margin-right: 1px;
            cursor: pointer;
            font-size: 14px;
            color: #555;
            flex-shrink: 0; /* Impede que as abas diminuam de tamanho */
        }

        /* Aba ativa (selecionada) */
        .tabs-menu li.active {
            background-color: #fff;
            font-weight: bold;
            color: #333;
            border: 1px solid #ddd;
            border-bottom: none;
            padding-bottom: 9px;
            z-index: 3;
            margin-top: -1px;
        }

        /* Seção do conteúdo principal */
        .tabs-content {
            background-color: #4c525a;
            height: 150px;
            position: relative;
            margin-top: -1px;
            border-radius: 0 0 0 0; /* Sem arredondamento no mobile para tela cheia */
            overflow: hidden;
        }

        /* Faixas diagonais */
        .tabs-content::before, .tabs-content::after, .tabs-content-inner::before, .tabs-content-inner::after {
            content: '';
            position: absolute;
            top: -20%;
            bottom: -20%;
            width: 2px;
            background-color: #0b223d;
            transform: skewX(-20deg);
            z-index: 5;
        }
        
        /* Posições das faixas diagonais (Ajuste para caber no mobile) */
        .tabs-content::before { left: 20%; }
        .tabs-content::after { left: 50%; } /* Posição central */
        
        .tabs-content-inner {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 20px;
            background-color: #e3e3e3;
            z-index: 1;
        }

        /* Linhas diagonais na faixa inferior */
        .tabs-content-inner::before { left: 40%; }
        .tabs-content-inner::after { left: 70%; }


        /* ----------------------------------------------------
           CSS - MEDIA QUERY (A partir de 768px - Desktop/Tablet)
           ---------------------------------------------------- */
        
        @media (min-width: 768px) {
            /* Restaura o fundo do body para centralizar o menu */
            body {
                display: flex;
                justify-content: center;
                align-items: flex-start;
                padding-top: 50px;
            }

            /* Define a largura fixa para desktop */
            .menu-container {
                width: 700px; 
                border-radius: 4px;
            }
            
            /* Adiciona o arredondamento de bordas no desktop */
            .tabs-content {
                border-radius: 0 4px 4px 4px;
            }

            /* Ajusta as posições das faixas para telas maiores */
            .tabs-content::before { left: 30%; }
            .tabs-content::after { left: 55%; }
            .tabs-content-inner::before { left: 45%; }
            .tabs-content-inner::after { left: 70%; }

            /* Ajusta o padding das abas */
            .tabs-menu li {
                padding: 8px 20px;
            }
        }

    </style>
</head>
<body>

    <div class="menu-container">
        <ul class="tabs-menu">
            <li class="tabs-arrow">&laquo;</li>
            <li class="tab active">home</li>
            <li class="tab">home</li>
            <li class="tab">home</li>
            <li class="tab">serviços</li> 
            <li class="tabs-arrow">&raquo;</li>
        </ul>

        <div class="tabs-content">
            <div class="tabs-content-inner"></div>
        </div>
    </div>

</body>
</html>
