<!DOCTYPE html>
<html>
<head>
    <title>Drift 3D - Corrida de Checkpoints</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div id="log">Status: Carregando...</div>
    <div id="hud">Velocidade: 0 km/h<br>Ângulo: 0°</div>
    <div id="coordinate-display">
        Coordenadas:<br>X: 0<br>Y: 0<br>Z: 0<br><br>Voltas: 0/3<br>Próximo: Largada
    </div>
    <div id="mobile-controls">
        
        <div class="control-group">
            <div class="control-button" id="btn-left">◀️</div>
            <div class="control-button" id="btn-right">▶️</div>
        </div>

        <div class="control-group">
            <div class="control-button" id="btn-drift">DRIFT</div>
            
            <div class="control-button" id="btn-up">⬆️</div>
            <div class="control-button" id="btn-down">⬇️</div>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>

    <script type="module" src="js/main.js"></script>
</body>
</html>
